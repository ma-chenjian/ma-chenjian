:root{
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --bg:#F2F6FA;
  --card:#FFFFFF;
  --ink:#131A24;
  --ink-2:#5A6675;
  --ink-3:#94A1B2;
  --line:#E2E9F2;
  --line-2:#D3DEEB;
  --blue:#1E7FD6;
  --blue-2:#3B95E8;
  --blue-soft:#E6F2FD;
  --price:#D97706;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 0 96px;
  color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.8;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background:var(--bg);
  background-image:
    radial-gradient(760px 380px at 50% -6%,rgba(10,102,179,.10) 0%,rgba(10,102,179,0) 66%),
    linear-gradient(180deg,#EFF5FB 0%,#F4F7FA 40%,#F2F6FA 100%);
  background-attachment:fixed;
}
.page{width:100%;max-width:540px;padding:16px 14px 0}
p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:8px}
::selection{background:rgba(10,102,179,.16)}

/* 首屏 */
.hero{
  position:relative;overflow:hidden;
  background:var(--card);
  border:1px solid var(--line);border-radius:20px;
  padding:22px 20px 18px;
  box-shadow:0 12px 28px -24px rgba(19,26,36,.55);
}
.hero::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--blue) 0%,#57A9E4 100%);
}
.hero__eyebrow{margin:0 0 12px;font-size:10px;letter-spacing:.32em;color:var(--blue);text-transform:uppercase;font-weight:600}
.hero__title{margin:0 0 8px;font-family:var(--serif);font-size:30px;line-height:1.3;font-weight:700;letter-spacing:.05em;color:var(--ink)}
.hero__sub{margin:0 0 16px;font-size:12px;letter-spacing:.18em;color:var(--ink-2)}
.hero__meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;letter-spacing:.04em;color:var(--ink-2)}
.hero__meta .num{font-family:var(--mono);color:var(--blue);font-weight:600}
.hero__meta i{font-style:normal;color:var(--line-2)}
.hero__meta .st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;color:var(--blue);background:var(--blue-soft);padding:5px 10px;border-radius:999px}
.st .dot{width:5px;height:5px;border-radius:50%;background:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.16)}
.st.is-closed{color:var(--ink-3);background:#EEF1F5}
.st.is-closed .dot{background:#B6C0CC;box-shadow:none}

/* 左栏 */
.shell{display:flex;gap:14px;align-items:flex-start;margin-top:14px}
.rail{
  flex:0 0 82px;width:82px;position:sticky;top:12px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:6px 0;
  max-height:calc(100vh - 40px);overflow-y:auto;scrollbar-width:none;
  box-shadow:0 10px 24px -24px rgba(19,26,36,.6);
}
.rail::-webkit-scrollbar{display:none}
.rail__g{font-size:9px;letter-spacing:.16em;color:var(--ink-3);padding:12px 0 4px 13px}
.rail a{position:relative;display:block;padding:9px 0 9px 13px;font-size:12.5px;line-height:1.4;color:var(--ink-2);transition:color .16s ease,background .16s ease}
.rail .cnt{font-size:10px;color:var(--ink-3);margin-left:3px;font-family:var(--mono)}
.rail a.on{color:var(--blue);font-weight:700;background:var(--blue-soft)}
.rail a.on .cnt{color:var(--blue);opacity:.7}
.rail a.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--blue)}
.rail a:active{background:#F4F7FA}
.pane{flex:1;min-width:0}

/* 标题 */
.panehead{margin:0 0 4px;padding:0 2px}
.panehead h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.06em;color:var(--ink)}
.panehead .cnt2{display:block;margin-top:5px;font-size:11px;letter-spacing:.04em;color:var(--ink-3)}
.hint{font-size:11.5px;line-height:1.7;color:var(--ink-3)}

/* 产品 */
.items{display:grid;grid-template-columns:1fr;gap:14px}
.items--single{max-width:400px}
.item{
  display:block;background:var(--card);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 10px 24px -22px rgba(19,26,36,.6);
  transition:transform .15s ease,box-shadow .15s ease;
}
.item:active{transform:scale(.986);box-shadow:0 6px 16px -14px rgba(19,26,36,.6)}
.item__img{
  position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;
  background:#F5F8FC;
  display:flex;align-items:center;justify-content:center;
  color:#B9C6D6;
}
.item__img img{width:100%;height:100%;object-fit:cover;display:block}
.item__img--fit img{object-fit:contain}
.item__b{padding:12px 13px 14px}
.item__name{margin:0 0 4px;font-size:15px;font-weight:700;letter-spacing:.02em;line-height:1.45;color:var(--ink)}
.item__model{margin:0 0 8px;font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);font-family:var(--mono)}
.item__price{font-family:var(--mono);font-size:14px;color:var(--price);margin-bottom:8px}
.item__price small{font-size:10px;color:var(--ink-3);margin-left:3px}
.item__tags{display:flex;flex-wrap:wrap;gap:5px}
.item__tags span{font-size:10.5px;letter-spacing:.02em;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:3px 8px}

/* 返回 */
.topbar{display:flex;align-items:center;gap:12px;padding:2px 0 14px}
.back{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.back i{font-style:normal;font-size:14px;line-height:1}

/* 详情 */
.detail{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 30px -26px rgba(19,26,36,.6)}

.detail__img img{width:100%;height:100%;object-fit:cover;display:block}
.detail__img--fit img{object-fit:contain}
.detail__b{padding:20px 18px 22px}

.detail__model{font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);font-family:var(--mono);margin-bottom:10px}

.btn:active{transform:scale(.986);opacity:.92}
.btn--line{border-color:var(--line-2);color:var(--ink-2);background:var(--card);letter-spacing:.04em}

/* 到店 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 16px;box-shadow:0 10px 24px -24px rgba(19,26,36,.6)}

.row__v.num{font-family:var(--mono);letter-spacing:.03em;user-select:all}

/* 提示 */
.toast{
  position:fixed;left:50%;top:22px;z-index:1000;transform:translate(-50%,-180%);
  background:rgba(19,26,36,.94);color:#fff;
  font-size:13px;line-height:1.5;padding:11px 18px;border-radius:12px;
  max-width:min(86vw,420px);text-align:center;
  transition:transform .28s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 16px 36px -18px rgba(0,0,0,.6);
}
.toast.show{transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero,.item,.detail,.panehead{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
.item:nth-child(2){animation-delay:.05s}
.item:nth-child(3){animation-delay:.1s}
.item:nth-child(4){animation-delay:.15s}
.item:nth-child(5){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){
  .hero,.item,.detail,.panehead{animation:none}
  .toast,.btn,.item{transition:none}
}

.foot{margin:26px 0 0;padding:14px 0 8px;border-top:1px solid var(--line);font-size:11px;line-height:1.9;color:var(--ink-3);text-align:center}

/* 底部微信条 */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;justify-content:center;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));

  pointer-events:none;

.bar__in{width:100%;max-width:540px;pointer-events:auto}

.btn--wx{background:linear-gradient(135deg,#1E7FD6,#3B95E8);border-color:transparent}

@media (min-width:740px){

  .rail{flex:0 0 104px;width:104px}

  .rail__g{font-size:9.5px;padding:14px 0 5px 15px}
  .hero__title{font-size:34px}
  .items{grid-template-columns:1fr 1fr;gap:16px}
  .item__name{font-size:15.5px}
  .panehead h2{font-size:21px}
  .detail{max-width:460px;margin:0 auto}
  .topbar{max-width:460px;margin:0 auto}
  .bar__in{max-width:720px}
}
@media (min-width:1000px){
  .page{max-width:980px}
  .items{grid-template-columns:repeat(auto-fill,minmax(225px,1fr))}
  .detail__name{font-size:26px}
  .bar__in{max-width:980px}

@media (min-width:1320px){
  .page{max-width:1180px}
  .items{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .bar__in{max-width:1180px}
}
</style>

  return null;
}
function catName(id) {
  for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].name;
  return '';
}
function inCat(p, id) { return id === 'all' ? true : p.cat === id; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function inquiryText(p) {
  return '你好，想问下这款：' + p.name + (p.model ? '（型号 ' + p.model + '）' : '') + '，现在什么价？';
}
function money(p) {
  if (!p) return '到店询价';
  var n = String(p).replace(/[^\d.]/g, '');
  if (!n) return '到店询价';
  var parts = n.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return '¥' + parts.join('.');
}
var ICON = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.6" cy="8.6" r="1.4"/><path d="M21 15.5l-4.6-4.6L6 21"/></svg>';
var ICON_BIG = '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.6" cy="8.6" r="1.4"/><path d="M21 15.5l-4.6-4.6L6 21"/></svg>';

function headHTML() {
  var h = new Date().getHours();
  var open = (h >= 8 && h < 18);
  return '<header class="hero">' +
    '<p class="hero__eyebrow">Qinhuangdao · Haigang</p>' +
    '<h1 class="hero__title">' + esc(STORE.name) + '</h1>' +
    '<p class="hero__sub">' + esc(STORE.name2) + '</p>' +
    '<div class="hero__meta">' +
      '<span>' + esc(STORE.addr) + '</span><i>/</i>' +
      '<span class="num">' + esc(STORE.phoneShow) + '</span>' +
      '<span class="st' + (open ? '' : ' is-closed') + '"><i class="dot"></i>' + (open ? '营业中' : '已打烊') + '</span>' +
    '</div>' +
  '</header>';
}

function railHTML(active) {
  var html = '<nav class="rail"><div class="rail__g">目录</div>';
  CATS.forEach(function (c) {
    var n = 0;
    PRODUCTS.forEach(function (p) { if (inCat(p, c.id)) n++; });
    html += '<a href="#/' + c.id + '"' + (c.id === active ? ' class="on"' : '') + '>' + esc(c.name) + '<span class="cnt">' + n + '</span></a>';
  });
  html += '<div class="rail__g">店铺</div>';
  html += '<a href="#/about"' + (active === 'about' ? ' class="on"' : '') + '>到店找我</a>';
  html += '</nav>';
  return html;
}

function itemHTML(p) {
  var img = p.img ? '<img src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">' : ICON;
  var sub = [p.model, p.brand].filter(Boolean).join(' · ');
  return '<a class="item" href="#/item/' + p.id + '">' +
    '<div class="item__img' + (p.fit === 'contain' ? ' item__img--fit' : '') + '">' + img + '</div>' +
    '<div class="item__b">' +
      '<p class="item__name">' + esc(p.name) + '</p>' +
      (sub ? '<p class="item__model">' + esc(sub) + '</p>' : '') +
      '<div class="item__tags">' + p.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
    '</div>' +
  '</a>';
}

function listView(catId) {
  var list = PRODUCTS.filter(function (p) { return inCat(p, catId); });
  var title = catId === 'all' ? '全部产品' : catName(catId);
  var pane = '<div class="pane">' +
    '<div class="panehead"><h2>' + esc(title) + '</h2>' +
      '<span class="cnt2">' + list.length + ' 件 · 实物在店</span></div>' +
    '<div style="height:16px"></div>' +
    '<div class="items' + (list.length === 1 ? ' items--single' : '') + '">' + list.map(itemHTML).join('') + '</div>' +
    '<p class="hint" style="text-align:center;margin-top:26px">实物都在店里，欢迎到店看</p>' +
  '</div>';
  return headHTML() + '<div class="shell">' + railHTML(catId) + pane + '</div>' +
    '<p class="foot">' + esc(STORE.addrFull) + '<br>' + esc(STORE.phoneShow) + '</p>';
}

function aboutView() {
  return headHTML() + '<div class="shell">' + railHTML('about') +
    '<div class="pane">' +
      '<div class="panehead"><h2>到店找我</h2><span class="cnt2">Visit the showroom</span></div>' +
      '<div style="height:14px"></div>' +
      '<div class="card">' +
        '<div class="row"><div class="row__b"><div class="row__k">ADDRESS</div>' +
          '<div class="row__v">' + esc(STORE.addrFull) + '</div></div>' +
          '<button class="btn btn--sm" type="button" data-copy="' + esc(STORE.addrFull) + '" data-msg="地址已复制">复制</button></div>' +
        '<div class="row"><div class="row__b"><div class="row__k">PHONE / WECHAT</div>' +
          '<div class="row__v num" style="font-size:17px">' + esc(STORE.phoneShow) + '</div></div>' +
          '<button class="btn btn--sm" type="button" data-copy="' + esc(STORE.phone) + '" data-msg="号码已复制，去微信搜索添加">复制</button></div>' +
        '<div class="row"><div class="row__b"><div class="row__k">HOURS</div>' +
          '<div class="row__v num">' + esc(STORE.hours) + '</div></div></div>' +
      '</div>' +
      '<p class="hint" style="margin-top:22px;line-height:1.9">' +
        '免费上门量坑距、看水电，装不装都来。<br>' +
        '送货、安装、拆旧、清运，一次上门办完。<br>' +
        '装完现场试水试冲，垃圾带走。' +
      '</p>' +
    '</div>' +
  '</div>' +
  '<p class="foot">' + esc(STORE.name) + '</p>';
}

function detailView(id) {
  var p = byId(id);
  if (!p) return listView('all');
  var img = p.img ? '<img src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">' : ICON_BIG;

  return '<div class="topbar"><a class="back" href="#/' + p.cat + '"><i>‹</i>' + esc(catName(p.cat)) + '</a></div>' +
    '<div class="detail">' +
      '<div class="detail__img' + (p.fit === 'contain' ? ' detail__img--fit' : '') + '">' + img + '</div>' +
      '<div class="detail__b">' +
        '<h1 class="detail__name">' + esc(p.name) + '</h1>' +
        '<p class="detail__model">' + ([p.model ? 'MODEL ' + esc(p.model) : '', p.brand].filter(Boolean).join(' · ')) + '</p>' +
        (p.note ? '<p class="detail__note">' + esc(p.note) + '</p>' : '<p class="detail__note">实物在店，欢迎来看</p>') +
        '<ul class="specs">' + p.tags.map(function (t) {
          return '<li><span class="chk">—</span><span>' + esc(t) + '</span></li>';
        }).join('') + '</ul>' +
        '<button class="btn btn--wx" type="button" data-copy="' + esc(inquiryText(p)) + '" data-msg="已复制，加微信 ' + esc(STORE.wechat) + ' 发给我">问这款</button>' +
        '<div style="height:10px"></div>' +
        '<a class="btn btn--line" href="#/' + p.cat + '">看看别的' + esc(catName(p.cat)) + '</a>' +
      '</div>' +
    '</div>' +
    '<p class="foot">' + esc(STORE.addrFull) + '<br>' + esc(STORE.phoneShow) + '</p>';
}

function parse() {
  var h = (location.hash || '').replace(/^#\/?/, '');
  return h.split('/').filter(Boolean);
}

function render() {
  var seg = parse();
  var app = document.getElementById('app');
  var title = STORE.name + '｜' + STORE.addr;

  if (seg.length === 0) {
    app.innerHTML = listView('all');
  } else if (seg[0] === 'about') {
    app.innerHTML = aboutView();
    title = '到店找我｜' + STORE.name;
  } else if (seg[0] === 'item') {
    var p = byId(seg[1]);
    if (p) title = p.name + '｜' + STORE.name;
    app.innerHTML = detailView(seg[1]);
  } else {
    var nm = catName(seg[0]);
    if (nm) title = nm + '｜' + STORE.name;
    app.innerHTML = listView(seg[0]);
  }
  document.title = title;
  bindCopy();
  window.scrollTo(0, 0);
}

var toastEl = document.getElementById('toast');
var timer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(timer);
  timer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
}
function legacyCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
function copy(text, msg) {
  function ok() { toast(msg); }
  function fail() { toast('复制失败，请长按内容手动复制'); }
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(ok, function () {
      legacyCopy(text) ? ok() : fail();
    });
  } else {
    legacyCopy(text) ? ok() : fail();
  }
}
function bindCopy() {
  var btns = document.querySelectorAll('[data-copy]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = function () {
      copy(this.getAttribute('data-copy'), this.getAttribute('data-msg') || '已复制');
    };
  }
}

/* ---------- 微信问价按钮 ---------- */
var wxBtn = document.getElementById('wxBtn');
if (wxBtn) {
  wxBtn.addEventListener('click', function () {
    if (!STORE.wechat) {
      toast('微信号还没定，先打 ' + STORE.phoneShow);
      return;
    }
    copy(STORE.wechat, '微信号已复制，打开微信搜索添加');
  });
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
