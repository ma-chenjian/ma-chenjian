<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#08080A">
<title>海尔智能卫浴｜秦皇岛彩龙建材城 AF1-156</title>
<meta name="description" content="秦皇岛海港区彩龙建材城 AF1-156。座便器、蹲便器、小便器、台下盆、墩布池、龙头五金，到店看实物。">
<meta property="og:type" content="website">
<meta property="og:title" content="海尔智能卫浴｜秦皇岛彩龙建材城 AF1-156">
<meta property="og:description" content="座便器、蹲便器、小便器、台下盆、墩布池、龙头五金，实物在店。">
<style>
:root{
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  --serif:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --ink:#EDE9E1;
  --ink-2:#A8A29A;
  --ink-3:#6E6862;
  --gold:#C9A96A;
  --gold-2:#E0C48A;
  --line:rgba(237,233,225,.10);
  --line-2:rgba(237,233,225,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 0 32px;
  color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.8;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background:#08080A;
  background-image:
    radial-gradient(900px 520px at 50% -10%,rgba(201,169,106,.10) 0%,rgba(201,169,106,0) 62%),
    radial-gradient(700px 500px at 100% 40%,rgba(70,90,120,.10) 0%,rgba(70,90,120,0) 62%),
    linear-gradient(180deg,#08080A 0%,#0A0A0D 60%,#070708 100%);
  background-attachment:fixed;
}
body::after{
  content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
.page{width:100%;max-width:540px;padding:22px 16px 0}
p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
::selection{background:rgba(201,169,106,.28)}

/* 首屏 */
.hero{position:relative;padding:6px 2px 22px;border-bottom:1px solid var(--line);margin-bottom:20px}
.hero__eyebrow{margin:0 0 16px;font-size:10px;letter-spacing:.34em;color:var(--ink-3);text-transform:uppercase}
.hero__title{margin:0 0 10px;font-family:var(--serif);font-size:31px;line-height:1.3;font-weight:600;letter-spacing:.06em;color:#F5F1E8}
.hero__sub{margin:0 0 20px;font-size:12px;letter-spacing:.24em;color:var(--gold);font-weight:500}
.hero__meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11.5px;letter-spacing:.12em;color:var(--ink-2)}
.hero__meta .num{font-family:var(--mono);letter-spacing:.06em}
.hero__meta i{font-style:normal;color:var(--ink-3)}
.hero__meta .st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.18em;color:var(--gold)}
.st .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.st.is-closed .dot{background:#8A7A5E;box-shadow:none}
.st.is-closed{color:var(--ink-3)}

/* 左栏 */
.shell{display:flex;gap:18px;align-items:flex-start}
.rail{flex:0 0 76px;width:76px;position:sticky;top:14px;padding:2px 0 0;border-right:1px solid var(--line);max-height:calc(100vh - 40px);overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail__g{font-size:9px;letter-spacing:.22em;color:var(--ink-3);padding:16px 0 7px 14px}
.rail a{position:relative;display:block;padding:9px 0 9px 14px;font-size:12.5px;line-height:1.4;letter-spacing:.04em;color:var(--ink-2);transition:color .18s ease}
.rail a.on{color:var(--gold-2);font-weight:600}
.rail a.on::before{content:"";position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:1px;height:15px;background:var(--gold);box-shadow:0 0 10px rgba(201,169,106,.8)}
.rail a:active{color:var(--ink)}
.rail .cnt{font-size:10px;color:var(--ink-3);margin-left:3px;font-family:var(--mono)}
.pane{flex:1;min-width:0}

/* 标题 */
.panehead{margin:0 0 4px}
.panehead h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.1em}
.panehead .cnt2{display:block;margin-top:6px;font-size:10px;letter-spacing:.2em;color:var(--ink-3)}
.hint{font-size:11.5px;line-height:1.7;color:var(--ink-3);letter-spacing:.02em}

/* 产品 */
.items{display:grid;grid-template-columns:1fr;gap:22px}
.items--single{max-width:420px}
.item{display:block;position:relative}
.item__img{
  position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;
  background:linear-gradient(150deg,#15151A 0%,#0B0B0E 52%,#101014 100%);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:rgba(201,169,106,.55);transition:border-color .25s ease;
}
.item__img::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,rgba(201,169,106,.07),transparent 60%);pointer-events:none}
.item__img img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.02) saturate(.96)}
.item:active .item__img{border-color:rgba(201,169,106,.45)}
.item__b{padding:13px 2px 0}
.item__name{margin:0 0 5px;font-size:15px;font-weight:600;letter-spacing:.04em;line-height:1.45}
.item__model{margin:0 0 6px;font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-family:var(--mono)}
.item__price{font-family:var(--mono);font-size:14px;letter-spacing:.04em;color:var(--gold)}
.item__price small{font-size:10px;letter-spacing:.1em;color:var(--ink-3);margin-left:4px;font-family:var(--sans)}
.item__tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.item__tags span{font-size:10px;letter-spacing:.06em;color:var(--ink-3);border:1px solid var(--line);border-radius:2px;padding:2px 7px}

/* 返回 */
.topbar{display:flex;align-items:center;gap:12px;padding:2px 0 20px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.18em;color:var(--ink-3)}
.back i{font-style:normal;font-size:13px}

/* 详情 */
.detail__img{
  position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;
  background:linear-gradient(150deg,#15151A 0%,#0B0B0E 52%,#101014 100%);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:rgba(201,169,106,.55);
}
.detail__img img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.02) saturate(.96)}
.detail__img::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,rgba(201,169,106,.08),transparent 62%);pointer-events:none}
.detail__b{padding:22px 2px 0}
.detail__name{margin:0 0 8px;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.06em;line-height:1.35}
.detail__model{font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);font-family:var(--mono);margin-bottom:14px}
.detail__price{font-family:var(--mono);font-size:20px;letter-spacing:.04em;color:var(--gold)}
.detail__note{font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);margin:6px 0 22px}
.specs{list-style:none;margin:0 0 24px;padding:0;border-top:1px solid var(--line)}
.specs li{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13.5px;letter-spacing:.04em;color:var(--ink-2)}
.specs .chk{color:var(--gold);font-size:10px;line-height:1.9;letter-spacing:0}

/* 按钮 */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 18px;border-radius:2px;border:1px solid var(--gold);font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--gold-2);background:transparent;cursor:pointer;transition:background .2s ease}
.btn:active{background:rgba(201,169,106,.12)}
.btn--line{border-color:var(--line-2);color:var(--ink-2);letter-spacing:.16em}
.btn--sm{width:auto;min-height:34px;padding:0 12px;font-size:11px;letter-spacing:.14em;font-weight:600;border:1px solid rgba(201,169,106,.4);color:var(--gold);border-radius:2px;background:transparent;flex:0 0 auto}

/* 到店 */
.card{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.row__b{flex:1;min-width:0}
.row__k{font-size:10px;letter-spacing:.2em;color:var(--ink-3);margin-bottom:5px}
.row__v{font-size:14px;line-height:1.65;letter-spacing:.03em}
.row__v.num{font-family:var(--mono);letter-spacing:.08em;user-select:all}

/* 提示 */
.toast{
  position:fixed;left:50%;top:24px;z-index:1000;transform:translate(-50%,-180%);
  background:rgba(20,20,24,.96);color:var(--gold-2);border:1px solid rgba(201,169,106,.35);
  font-size:12px;letter-spacing:.08em;line-height:1.5;padding:12px 20px;border-radius:2px;
  max-width:min(86vw,420px);text-align:center;transition:transform .3s cubic-bezier(.2,.9,.3,1);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.9);
}
.toast.show{transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero,.item,.detail,.panehead{animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
.item:nth-child(2){animation-delay:.06s}
.item:nth-child(3){animation-delay:.12s}
.item:nth-child(4){animation-delay:.18s}
.item:nth-child(5){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){
  .hero,.item,.detail,.panehead{animation:none}
  .toast,.btn,.item__img{transition:none}
}

.foot{margin:34px 0 0;padding:18px 0 8px;border-top:1px solid var(--line);font-size:10px;line-height:2;letter-spacing:.16em;color:var(--ink-3);text-align:center}

@media (min-width:740px){
  .page{max-width:720px;padding:30px 26px 0}
  .rail{flex:0 0 104px;width:104px}
  .rail a{font-size:13.5px;padding:11px 0 11px 16px}
  .rail__g{font-size:9.5px;padding:18px 0 8px 16px}
  .hero__title{font-size:36px}
  .items{grid-template-columns:1fr 1fr;gap:26px}
  .item__name{font-size:15.5px}
  .panehead h2{font-size:21px}
  .detail{max-width:640px;margin:0 auto}
  .detail__img{aspect-ratio:16/10}
  .topbar{max-width:640px;margin:0 auto}
}
@media (min-width:1000px){
  .page{max-width:980px}
  .items{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .detail__name{font-size:28px}
}
@media (min-width:1320px){
  .page{max-width:1180px}
  .items{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
}
</style>
</head>
<body>

<main class="page">
  <div id="app"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   数据区：改内容只改这里
   price  填数字，页面显示 ¥550；留空显示“到店询价”
   unit   /套  /个  /台
   img    留空就显示暗色占位
   ========================================================= */
var STORE = {
  name: '海尔智能卫浴',
  name2: '卫浴洁具 · 工程与零售',
  addr: '彩龙建材城 AF1-156',
  addrFull: '秦皇岛市海港区 彩龙建材城 AF1-156',
  phone: '13133565318',
  phoneShow: '131 3356 5318',
  hours: '每天 8:00 – 18:00'
};

var CATS = [
  { id: 'all', name: '全部', label: '' },
  { id: 'toilet', name: '座便器', label: 'Toilet' },
  { id: 'squat', name: '蹲便器', label: 'Squat' },
  { id: 'urinal', name: '小便器', label: 'Urinal' },
  { id: 'basin', name: '洗手盆', label: 'Basin' },
  { id: 'mop', name: '拖布池', label: 'Mop' },
  { id: 'faucet', name: '五金配件', label: 'Fittings' }
];

var PRODUCTS = [
  { id: 'p1', cat: 'toilet', name: '座便器', model: 'LD77210', brand: '申鹭达', price: '', unit: '套',
    tags: ['成人款','下排水','节水'], img: 'images/toilet.jpg', note: '' },
  { id: 'p2', cat: 'squat', name: '蹲便器', model: '', brand: '佳陶', price: '', unit: '套',
    tags: ['成人款','配暗装延时开关'], img: 'images/squat.jpg', note: '图为暗装延时冲水阀，仅供参考' },
  { id: 'p3', cat: 'urinal', name: '小便器', model: '', brand: '佳陶', price: '', unit: '套',
    tags: ['壁挂式','感应冲水'], img: 'images/urinal.jpg', note: '' },
  { id: 'p4', cat: 'basin', name: '台下盆', model: '', brand: '佳陶', price: '', unit: '个',
    tags: ['台下盆','椭圆'], img: 'images/basin.jpg', note: '' },
  { id: 'p5', cat: 'mop', name: '墩布池', model: '', brand: '佳陶', price: '', unit: '套',
    tags: ['含加长龙头','含下水'], img: 'images/mop.jpg', note: '' },
  { id: 'p6', cat: 'faucet', name: '墙壁水嘴', model: '', brand: '佳陶', price: '', unit: '套',
    tags: ['入墙式','单冷'], img: '', note: '' }
];

/* ================= 以下不用改 ================= */
function byId(id) {
  for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i];
  return null;
}
function catName(id) {
  for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].name;
  return '';
}
function inCat(p, id) { return id === 'all' ? true : p.cat === id; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function money(p) {
  if (!p) return '到店询价';
  var n = String(p).replace(/[^\d.]/g, '');
  if (!n) return '到店询价';
  var parts = n.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return '¥' + parts.join('.');
}
var ICON = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.6" cy="8.6" r="1.4"/><path d="M21 15.5l-4.6-4.6L6 21"/></svg>';
var ICON_BIG = '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.6" cy="8.6" r="1.4"/><path d="M21 15.5l-4.6-4.6L6 21"/></svg>';

function headHTML() {
  var h = new Date().getHours();
  var open = (h >= 8 && h < 18);
  return '<header class="hero">' +
    '<p class="hero__eyebrow">Qinhuangdao · Haigang</p>' +
    '<h1 class="hero__title">' + esc(STORE.name) + '</h1>' +
    '<p class="hero__sub">' + esc(STORE.name2) + '</p>' +
    '<div class="hero__meta">' +
      '<span>' + esc(STORE.addr) + '</span><i>/</i>' +
      '<span class="num">' + esc(STORE.phoneShow) + '</span>' +
      '<span class="st' + (open ? '' : ' is-closed') + '"><i class="dot"></i>' + (open ? '营业中' : '已打烊') + '</span>' +
    '</div>' +
  '</header>';
}

function railHTML(active) {
  var html = '<nav class="rail"><div class="rail__g">目录</div>';
  CATS.forEach(function (c) {
    var n = 0;
    PRODUCTS.forEach(function (p) { if (inCat(p, c.id)) n++; });
    html += '<a href="#/' + c.id + '"' + (c.id === active ? ' class="on"' : '') + '>' + esc(c.name) + '<span class="cnt">' + n + '</span></a>';
  });
  html += '<div class="rail__g">店铺</div>';
  html += '<a href="#/about"' + (active === 'about' ? ' class="on"' : '') + '>到店找我</a>';
  html += '</nav>';
  return html;
}

function itemHTML(p) {
  var img = p.img ? '<img src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">' : ICON;
  return '<a class="item" href="#/item/' + p.id + '">' +
    '<div class="item__img">' + img + '</div>' +
    '<div class="item__b">' +
      '<p class="item__name">' + esc(p.name) + '</p>' +
      '<p class="item__model">' + (p.model ? esc(p.model) + ' · ' : '') + esc(p.brand) + '</p>' +
      '<p class="item__price">' + money(p.price) + (p.unit ? '<small>/' + esc(p.unit) + '</small>' : '') + '</p>' +
      '<div class="item__tags">' + p.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
    '</div>' +
  '</a>';
}

function listView(catId) {
  var list = PRODUCTS.filter(function (p) { return inCat(p, catId); });
  var title = catId === 'all' ? '全部产品' : catName(catId);
  var pane = '<div class="pane">' +
    '<div class="panehead"><h2>' + esc(title) + '</h2>' +
      '<span class="cnt2">' + list.length + ' 件 · 实物在店</span></div>' +
    '<div style="height:16px"></div>' +
    '<div class="items' + (list.length === 1 ? ' items--single' : '') + '">' + list.map(itemHTML).join('') + '</div>' +
    '<p class="hint" style="text-align:center;margin-top:26px">价格以到店为准 · 大批量可谈工程价</p>' +
  '</div>';
  return headHTML() + '<div class="shell">' + railHTML(catId) + pane + '</div>' +
    '<p class="foot">' + esc(STORE.addrFull) + '<br>' + esc(STORE.phoneShow) + '</p>';
}

function aboutView() {
  return headHTML() + '<div class="shell">' + railHTML('about') +
    '<div class="pane">' +
      '<div class="panehead"><h2>到店找我</h2><span class="cnt2">Visit the showroom</span></div>' +
      '<div style="height:14px"></div>' +
      '<div class="card">' +
        '<div class="row"><div class="row__b"><div class="row__k">ADDRESS</div>' +
          '<div class="row__v">' + esc(STORE.addrFull) + '</div></div>' +
          '<button class="btn btn--sm" type="button" data-copy="' + esc(STORE.addrFull) + '" data-msg="地址已复制">复制</button></div>' +
        '<div class="row"><div class="row__b"><div class="row__k">PHONE / WECHAT</div>' +
          '<div class="row__v num" style="font-size:17px">' + esc(STORE.phoneShow) + '</div></div>' +
          '<button class="btn btn--sm" type="button" data-copy="' + esc(STORE.phone) + '" data-msg="号码已复制，去微信搜索添加">复制</button></div>' +
        '<div class="row"><div class="row__b"><div class="row__k">HOURS</div>' +
          '<div class="row__v num">' + esc(STORE.hours) + '</div></div></div>' +
      '</div>' +
      '<p class="hint" style="margin-top:22px;line-height:1.9">' +
        '免费上门量坑距、看水电，装不装都来。<br>' +
        '送货、安装、拆旧、清运，一次上门办完。<br>' +
        '装完现场试水试冲，垃圾带走。' +
      '</p>' +
    '</div>' +
  '</div>' +
  '<p class="foot">' + esc(STORE.name) + '</p>';
}

function detailView(id) {
  var p = byId(id);
  if (!p) return listView('all');
  var img = p.img ? '<img src="' + esc(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">' : ICON_BIG;

  return '<div class="topbar"><a class="back" href="#/' + p.cat + '"><i>‹</i>' + esc(catName(p.cat)) + '</a></div>' +
    '<div class="detail">' +
      '<div class="detail__img">' + img + '</div>' +
      '<div class="detail__b">' +
        '<h1 class="detail__name">' + esc(p.name) + '</h1>' +
        '<p class="detail__model">' + (p.model ? 'MODEL ' + esc(p.model) + ' · ' : '') + esc(p.brand) + '</p>' +
        '<p class="detail__price">' + money(p.price) + '</p>' +
        '<p class="detail__note">' + (p.price ? '每' + esc(p.unit || '套') + ' · ' : '') + '价格以到店为准' + (p.note ? ' · ' + esc(p.note) : '') + '</p>' +
        '<ul class="specs">' + p.tags.map(function (t) {
          return '<li><span class="chk">—</span><span>' + esc(t) + '</span></li>';
        }).join('') + '</ul>' +
        '<button class="btn" type="button" data-copy="' + esc(STORE.phone) + '" data-msg="号码已复制，去微信搜索添加">复制号码 · 加微信问</button>' +
        '<div style="height:10px"></div>' +
        '<a class="btn btn--line" href="#/' + p.cat + '">看看别的' + esc(catName(p.cat)) + '</a>' +
      '</div>' +
    '</div>' +
    '<p class="foot">' + esc(STORE.addrFull) + '<br>' + esc(STORE.phoneShow) + '</p>';
}

function parse() {
  var h = (location.hash || '').replace(/^#\/?/, '');
  return h.split('/').filter(Boolean);
}

function render() {
  var seg = parse();
  var app = document.getElementById('app');
  var title = STORE.name + '｜' + STORE.addr;

  if (seg.length === 0) {
    app.innerHTML = listView('all');
  } else if (seg[0] === 'about') {
    app.innerHTML = aboutView();
    title = '到店找我｜' + STORE.name;
  } else if (seg[0] === 'item') {
    var p = byId(seg[1]);
    if (p) title = p.name + '｜' + STORE.name;
    app.innerHTML = detailView(seg[1]);
  } else {
    var nm = catName(seg[0]);
    if (nm) title = nm + '｜' + STORE.name;
    app.innerHTML = listView(seg[0]);
  }
  document.title = title;
  bindCopy();
  window.scrollTo(0, 0);
}

var toastEl = document.getElementById('toast');
var timer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(timer);
  timer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
}
function legacyCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
function copy(text, msg) {
  function ok() { toast(msg); }
  function fail() { toast('复制失败，请长按内容手动复制'); }
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(ok, function () {
      legacyCopy(text) ? ok() : fail();
    });
  } else {
    legacyCopy(text) ? ok() : fail();
  }
}
function bindCopy() {
  var btns = document.querySelectorAll('[data-copy]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = function () {
      copy(this.getAttribute('data-copy'), this.getAttribute('data-msg') || '已复制');
    };
  }
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
