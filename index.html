  });
  html += '<div class="rail__g">店铺</div>';
  html += '<a href="#/about"' + (active === 'about' ? ' class="on"' : '') + '>到店找我</a>';
  html += '</nav>';
  return html;
}

/* ---------- 产品卡 ---------- */
function itemHTML(c, it) {
  var img = it.img ? '<img src="' + esc(it.img) + '" alt="' + esc(it.name) + '" loading="lazy">' : ICON;
  return '<a class="item" href="#/' + c.id + '/' + it.id + '" style="--g:' + c.g + '">' +
    '<div class="item__img">' + img + '</div>' +
    '<div class="item__b">' +
      '<p class="item__name">' + esc(it.name) + '</p>' +
      (it.model ? '<p class="item__model">' + esc(it.model) + '</p>' : '') +
      '<div class="item__tags">' + it.tags.slice(0, 3).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<p class="item__price">' + money(it.price) + (it.price ? '<small>起</small>' : '') + '</p>' +
    '</div>' +
  '</a>';
}

/* ---------- 主视图：左栏 + 右内容 ---------- */
function shellView(activeId) {
  var c = findByCat(activeId) || ALL_CATS[0];

  var pane = '<div class="pane">' +
    '<div class="panehead"><h2>' + esc(c.name) + '</h2><span>' + c.items.length + ' 款</span></div>' +
    '<p class="panesub hint">' + esc(c.sub) + '</p>' +
    '<div class="items">' + c.items.map(function (it) { return itemHTML(c, it); }).join('') + '</div>' +
    '<p class="hint" style="text-align:center;margin-top:14px">价格以到店为准，实物都在店里</p>' +
  '</div>';

  return headHTML() + '<div class="shell">' + railHTML(c.id) + pane + '</div>' +
    '<p class="foot">' + esc(STORE.addrFull) + '　|　' + esc(STORE.phoneShow) + '</p>';
}

/* ---------- 到店页 ---------- */
function aboutView() {
  return headHTML() + '<div class="shell">' + railHTML('about') +
    '<div class="pane">' +
      '<div class="panehead"><h2>到店找我</h2></div>' +
      '<div class="card">' +
        '<div class="row"><div class="row__b"><div class="row__k">门店地址</div>' +
          '<div class="row__v">' + esc(STORE.addrFull) + '</div></div>' +
          '<button class="btn btn--sm" type="button" data-copy="' + esc(STORE.addrFull) + '" data-msg="地址已复制">复制</button></div>' +
        '<div class="row"><div class="row__b"><div class="row__k">电话 / 微信同号</div>' +
          '<div class="row__v num">' + esc(STORE.phoneShow) + '</div></div>' +
          '<button class="btn btn--sm" type="button" data-copy="' + esc(STORE.phone) + '" data-msg="号码已复制">复制</button></div>' +
        '<div class="row"><div class="row__b"><div class="row__k">营业时间</div>' +
          '<div class="row__v num">' + esc(STORE.hours) + '</div></div></div>' +
      '</div>' +
      '<div style="height:12px"></div>' +
      '<div class="card" style="padding:14px 16px">' +
        '<p class="hint" style="line-height:1.75">免费上门量坑距、看水电，装不装都来；送货、安装、拆旧、清运一次上门办完；装完现场试水试冲，垃圾带走。</p>' +
      '</div>' +
    '</div>' +
  '</div>' +
  '<p class="foot">' + esc(STORE.name) + '<br>' + esc(STORE.addrFull) + '</p>';
}

/* ---------- 详情页 ---------- */
function detailView(catId, itemId) {
  var c = findByCat(catId);
  if (!c) return shellView(ALL_CATS[0].id);
  var it = findItem(c, itemId);
  if (!it) return shellView(catId);
  var img = it.img ? '<img src="' + esc(it.img) + '" alt="' + esc(it.name) + '" loading="lazy">' : ICON_BIG;

  return '<div class="topbar"><a class="back" href="#/' + c.id + '"><i>‹</i>' + esc(c.name) + '</a></div>' +
    '<div class="detail" style="--g:' + c.g + '">' +
      '<div class="detail__img">' + img + '</div>' +
      '<div class="detail__b">' +
        '<h1 class="detail__name">' + esc(it.name) + '</h1>' +
        (it.model ? '<p class="detail__model">型号 ' + esc(it.model) + '</p>' : '') +
        '<p class="detail__price">' + money(it.price) + '</p>' +
        '<p class="detail__note">价格以到店为准，旧机可抵扣</p>' +
        '<ul class="specs">' + it.tags.map(function (t) {
          return '<li><span class="chk">✓</span><span>' + esc(t) + '</span></li>';
        }).join('') + '</ul>' +
        '<a class="btn btn--primary" href="tel:' + esc(STORE.phone) + '">打电话问这款</a>' +
        '<div style="height:9px"></div>' +
        '<a class="btn btn--line" href="#/' + c.id + '">看看别的' + esc(c.name) + '</a>' +
      '</div>' +
    '</div>' +
    '<p class="foot">' + esc(STORE.addrFull) + '　|　' + esc(STORE.phoneShow) + '</p>';
}

/* ---------- 路由 ---------- */
function parse() {
  var h = (location.hash || '').replace(/^#\/?/, '');
  return h.split('/').filter(Boolean);
}

function render() {
  var p = parse();
  var app = document.getElementById('app');
  var title = STORE.name + '｜' + STORE.addr;

  if (p.length === 0) {
    app.innerHTML = shellView(ALL_CATS[0].id);
  } else if (p[0] === 'about') {
    app.innerHTML = aboutView();
    title = '到店找我｜' + STORE.name;
  } else if (p.length === 1) {
    var c1 = findByCat(p[0]);
    if (c1) title = c1.name + '｜' + STORE.name;
    app.innerHTML = shellView(p[0]);
  } else {
    var c2 = findByCat(p[0]);
    var it = findItem(c2, p[1]);
    if (it) title = it.name + '｜' + (c2 ? c2.name : '');
    app.innerHTML = detailView(p[0], p[1]);
  }
  document.title = title;
  bindCopy();
  window.scrollTo(0, 0);
}

/* ---------- 复制 ---------- */
var toastEl = document.getElementById('toast');
var timer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(timer);
  timer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
}
function legacyCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
function copy(text, msg) {
  function ok() { toast(msg); }
  function fail() { toast('复制失败，请长按内容手动复制'); }
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(ok, function () {
      legacyCopy(text) ? ok() : fail();
    });
  } else {
    legacyCopy(text) ? ok() : fail();
  }
}
function bindCopy() {
  var btns = document.querySelectorAll('[data-copy]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].onclick = function () {
      copy(this.getAttribute('data-copy'), this.getAttribute('data-msg') || '已复制');
    };
  }
}

/* ---------- 拨号 / 导航：先按原样触发，没反应才给备用方案 ---------- */
var lastAttempt = 0;
function watchFail(onFail) {
  var fired = false;
  function mark() { fired = true; }
  document.addEventListener('visibilitychange', mark, { once: true });
  window.addEventListener('pagehide', mark, { once: true });
  setTimeout(function () {
    if (fired || document.hidden || Date.now() - lastAttempt > 2000) return;
    onFail();
  }, 1600);
}

document.addEventListener('click', function (e) {
  var el = e.target;
  while (el && el.tagName !== 'A') el = el.parentNode;
  if (!el || el.tagName !== 'A') return;

  var href = el.getAttribute('href') || '';
  lastAttempt = Date.now();

  if (/^tel:/.test(href)) {
    watchFail(function () {
      copy(href.replace(/^tel:/, ''), '号码已复制，粘到拨号盘就能打');
    });
  } else if (href.indexOf('uri.amap.com') > -1) {
    watchFail(function () {
      copy(STORE.addrFull, '地址已复制，打开高德粘贴搜索');
    });
  }
}, true);

window.addEventListener('hashchange', render);
render();
</script>
